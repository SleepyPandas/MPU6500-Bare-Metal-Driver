name: Deploy Doxygen Docs

on:
  push:
    branches: ["main", "Add-Documentation-site"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Download doxygen-awesome-css theme
        run: |
          mkdir -p docs/theme
          BASE="https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/v2.3.4"
          curl -fsSL "$BASE/doxygen-awesome.css"                  -o docs/theme/doxygen-awesome.css
          curl -fsSL "$BASE/doxygen-awesome-sidebar-only.css"      -o docs/theme/doxygen-awesome-sidebar-only.css
          curl -fsSL "$BASE/doxygen-awesome-darkmode-toggle.js"    -o docs/theme/doxygen-awesome-darkmode-toggle.js

      - name: Generate documentation
        run: |
          rm -rf docs/doxygen/html
          doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
